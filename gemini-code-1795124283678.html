<script>
(function () {
  const PIN = "1750";
  const ch = ("BroadcastChannel" in window) ? new BroadcastChannel("barock-quiz-host") : null;

  function forceHostLogin() {
    try {
      localStorage.setItem("isHost", "true");
      localStorage.setItem("hostUnlocked", PIN);
      localStorage.setItem("barock_quiz_host_1750", "true");
      window.dispatchEvent(new Event("storage"));
    } catch (e) {}

    if (ch) {
      try { ch.postMessage({ type: "host-unlocked", pin: PIN, isHost: true }); } catch (e) {}
    }

    document.querySelectorAll("details").forEach((d) => {
      if (/host|vortrag|1750/i.test(d.textContent || "")) d.open = true;
    });

    document.querySelectorAll("input").forEach((inp) => {
      const hint = ((inp.placeholder || "") + " " + (inp.id || "") + " " + (inp.name || "")).toLowerCase();
      if (inp.type === "password" || hint.includes("pin") || hint.includes("code") || hint.includes("host")) {
        inp.value = PIN;
        inp.dispatchEvent(new Event("input", { bubbles: true }));
        inp.dispatchEvent(new Event("change", { bubbles: true }));
      }
    });

    for (const k of Object.keys(window)) {
      const fn = window[k];
      if (typeof fn === "function" && /(host|lobby|room|unlock|pin|login)/i.test(k)) {
        try { fn(PIN); } catch (e) {}
      }
    }

    document.querySelectorAll("[id*='lobby'], [class*='lobby'], [id*='host-panel'], [class*='host-panel'], [data-host-view]").forEach((el) => {
      el.hidden = false;
      el.removeAttribute("hidden");
      el.classList.remove("hidden", "hide", "d-none", "locked");
      if (getComputedStyle(el).display === "none") {
        el.style.display = "block";
      }
    });
  }

  document.addEventListener("click", (ev) => {
    const target = ev.target.closest("button, [role='button'], input[type='submit']");
    if (!target) return;
    const label = ((target.textContent || "") + " " + (target.id || "") + " " + (target.value || "")).toLowerCase();
    if (label.includes("host") || label.includes("raum") || label.includes("1750")) {
      setTimeout(forceHostLogin, 0);
    }
  }, true);

  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    const inp = ev.target;
    if (!inp || inp.tagName !== "INPUT") return;
    const hint = ((inp.placeholder || "") + " " + (inp.id || "")).toLowerCase();
    if (inp.type === "password" || hint.includes("pin") || hint.includes("code") || hint.includes("host")) {
      inp.value = PIN;
      setTimeout(forceHostLogin, 0);
    }
  }, true);

  window.forceHost1750 = forceHostLogin;
})();
</script>
