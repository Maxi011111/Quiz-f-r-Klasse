    // =========================================================================
    // 2. ECHTZEIT-MULTIPLAYER SETUP (FIREBASE FALLS VORHANDEN + LOKALER LIVE-STORE)
    // =========================================================================
    let db = null;
    let auth = null;
    let currentUser = null;
    let firebaseReady = false;
    let localLiveReady = false;
    const appId = typeof __app_id !== "undefined" ? __app_id : "barock-vortrag-quiz";
    const localSessionUid = "local_" + Math.random().toString(36).slice(2, 12);

    const localRoomListeners = new Map();
    const localPlayersListeners = new Map();
    const liveChannels = new Map();

    function roomStorageKey(code) {
      return `barock_live_room_${appId}_${code}`;
    }

    function playersStorageKey(code) {
      return `barock_live_players_${appId}_${code}`;
    }

    function readJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function writeJsonStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }

    function getLiveChannel(code) {
      if (typeof BroadcastChannel === "undefined") return null;
      const name = `barock_live_sync_${appId}_${code}`;
      if (!liveChannels.has(name)) {
        const ch = new BroadcastChannel(name);
        ch.onmessage = (ev) => {
          const msg = ev.data || {};
          if (msg.type === "room_update" && msg.code === code) {
            const roomData = readJsonStorage(roomStorageKey(code), null);
            if (roomData) notifyLocalRoomListeners(code, roomData);
          } else if (msg.type === "players_update" && msg.code === code) {
            const pMap = readJsonStorage(playersStorageKey(code), {});
            notifyLocalPlayersListeners(code, pMap);
          }
        };
        liveChannels.set(name, ch);
      }
      return liveChannels.get(name);
    }

    function notifyLocalRoomListeners(code, data) {
      const set = localRoomListeners.get(code);
      if (!set) return;
      set.forEach((cb) => {
        try {
          cb(data);
        } catch (err) {
          console.error("Local room listener error:", err);
        }
      });
    }

    function notifyLocalPlayersListeners(code, playersObj) {
      const set = localPlayersListeners.get(code);
      if (!set) return;
      set.forEach((cb) => {
        try {
          cb(playersObj || {});
        } catch (err) {
          console.error("Local players listener error:", err);
        }
      });
    }

    window.addEventListener("storage", (ev) => {
      if (!ev.key) return;
      const roomPrefix = `barock_live_room_${appId}_`;
      const playersPrefix = `barock_live_players_${appId}_`;
      if (ev.key.startsWith(roomPrefix)) {
        const code = ev.key.slice(roomPrefix.length);
        const roomData = ev.newValue ? JSON.parse(ev.newValue) : null;
        if (roomData) notifyLocalRoomListeners(code, roomData);
      } else if (ev.key.startsWith(playersPrefix)) {
        const code = ev.key.slice(playersPrefix.length);
        const pMap = ev.newValue ? JSON.parse(ev.newValue) : {};
        notifyLocalPlayersListeners(code, pMap);
      }
    });

    async function initFirebase() {
      localLiveReady = true;
      try {
        if (typeof __firebase_config === "undefined") {
          return true;
        }
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
        firebaseReady = true;
        return true;
      } catch (err) {
        console.warn("Firebase nicht verfügbar, lokaler Live-Store aktiv:", err);
        firebaseReady = false;
        return true;
      }
    }

    function hasLiveBackend() {
      return Boolean((firebaseReady && currentUser) || localLiveReady);
    }

    function activeBackendUid() {
      return currentUser?.uid || localSessionUid;
    }

    async function writeRoomRecord(code, data, merge = true) {
      const prev = merge ? readJsonStorage(roomStorageKey(code), {}) : {};
      const next = { ...prev, ...data };
      writeJsonStorage(roomStorageKey(code), next);
      getLiveChannel(code)?.postMessage({ type: "room_update", code });
      notifyLocalRoomListeners(code, next);

      if (firebaseReady && currentUser) {
        try {
          if (merge) {
            await setDoc(roomDocRef(code), data, { merge: true });
          } else {
            await setDoc(roomDocRef(code), data);
          }
        } catch (err) {
          console.warn("Firestore writeRoomRecord fallback aktiv:", err);
        }
      }
    }

    async function readRoomRecord(code) {
      const cleanCode = String(code || "").trim();
      if (firebaseReady && currentUser) {
        try {
          const snap = await getDoc(roomDocRef(cleanCode));
          if (snap.exists()) {
            const remote = snap.data();
            writeJsonStorage(roomStorageKey(cleanCode), remote);
            return remote;
          }
        } catch (err) {
          console.warn("Firestore readRoomRecord fallback:", err);
        }
      }

      const localData = readJsonStorage(roomStorageKey(cleanCode), null);
      if (localData) return localData;
      return null;
    }

    async function writePlayerRecord(code, pid, playerData) {
      const all = readJsonStorage(playersStorageKey(code), {});
      all[pid] = { ...(all[pid] || {}), ...playerData };
      writeJsonStorage(playersStorageKey(code), all);
      getLiveChannel(code)?.postMessage({ type: "players_update", code });
      notifyLocalPlayersListeners(code, all);

      if (firebaseReady && currentUser) {
        try {
          await setDoc(playerDocRef(code, pid), all[pid], { merge: true });
        } catch (err) {
          console.warn("Firestore writePlayerRecord fallback aktiv:", err);
        }
      }
    }

    function subscribeRoomStream(code, onData) {
      getLiveChannel(code);
      if (!localRoomListeners.has(code)) {
        localRoomListeners.set(code, new Set());
      }
      localRoomListeners.get(code).add(onData);

      const initial = readJsonStorage(roomStorageKey(code), null);
      if (initial) onData(initial);

      let firestoreUnsub = null;
      if (firebaseReady && currentUser) {
        firestoreUnsub = onSnapshot(
          roomDocRef(code),
          (roomSnap) => {
            if (!roomSnap.exists()) return;
            const remote = roomSnap.data();
            writeJsonStorage(roomStorageKey(code), remote);
            onData(remote);
          },
          (error) => {
            console.error("Room listener error:", error);
          }
        );
      }

      return () => {
        localRoomListeners.get(code)?.delete(onData);
        if (firestoreUnsub) firestoreUnsub();
      };
    }

    function subscribePlayersStream(code, onMap) {
      getLiveChannel(code);
      if (!localPlayersListeners.has(code)) {
        localPlayersListeners.set(code, new Set());
      }
      localPlayersListeners.get(code).add(onMap);

      const initial = readJsonStorage(playersStorageKey(code), {});
      onMap(initial);

      let firestoreUnsub = null;
      if (firebaseReady && currentUser) {
        firestoreUnsub = onSnapshot(
          playersColRef(code),
          (snapshot) => {
            const updated = {};
            snapshot.forEach((docSnap) => {
              updated[docSnap.id] = docSnap.data();
            });
            writeJsonStorage(playersStorageKey(code), updated);
            onMap(updated);
          },
          (error) => {
            console.error("Players listener error:", error);
          }
        );
      }

      return () => {
        localPlayersListeners.get(code)?.delete(onMap);
        if (firestoreUnsub) firestoreUnsub();
      };
    }

      try {
        localStorage.setItem(`barock_host_token_${code}`, token);

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Erzeugt die spielbare Fragenliste anhand der Host-Einstellungen
    function buildActiveQuestions(shuffleQ, shuffleOpts) {
      let list = BASE_QUESTIONS.map((q) => ({
        ...q,
        options: [...q.options]
      }));

      if (shuffleQ) {
        list = shuffleArray(list);
      }

      if (shuffleOpts) {
        list = list.map((q) => {
          const indexed = q.options.map((text, idx) => ({
            text,
            isCorrect: idx === q.correctIndex
          }));
          const mixed = shuffleArray(indexed);
          return {
            ...q,
            options: mixed.map((m) => m.text),
            correctIndex: mixed.findIndex((m) => m.isCorrect)
          };
        });
      }
      return list;
    }

    function getJoinUrl(code) {

    // Sound-Effekte über Web Audio API (keine externen URLs)
    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "select") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.11);
        } else if (type === "correct") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.09);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(155, now + 0.2);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        } else if (type === "fanfare") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.12);
          osc.frequency.setValueAtTime(783.99, now + 0.24);
          osc.frequency.setValueAtTime(1046.5, now + 0.36);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          osc.start(now);
          osc.stop(now + 0.66);
        }
      } catch (_) {}
    }

    function launchConfetti() {
      const colors = ["#facc15", "#e11d48", "#3b82f6", "#10b981", "#f59e0b", "#a855f7"];

        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = 2.2 + Math.random() * 2 + "s";
        piece.style.animationDelay = Math.random() * 0.6 + "s";

    function downloadQrPng() {
      const container = document.getElementById("lobby-qr-box");
      if (!container) return;

      const sourceCanvas = container.querySelector("canvas");
      const sourceImg = container.querySelector("img");

      // Erstellt eine schicke Folien-Grafik mit QR-Code + Raum-Code zum direkten Einfügen in PowerPoint/Keynote
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = 520;
      exportCanvas.height = 620;
      const ctx = exportCanvas.getContext("2d");

      // Hintergrund & goldener Rahmen
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      ctx.strokeStyle = "#d4af37";
      ctx.lineWidth = 10;
      ctx.strokeRect(14, 14, exportCanvas.width - 28, exportCanvas.height - 28);

      // Titel oben
      ctx.fillStyle = "#0a1128";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("BAROCK-QUIZ · MITSPIELEN", 260, 68);

      ctx.fillStyle = "#475569";
      ctx.font = "600 18px sans-serif";
      ctx.fillText("QR-Code scannen & Namen eingeben", 260, 100);

      const drawFooterAndSave = () => {
        ctx.fillStyle = "#0a1128";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("Oder Raum-Code eingeben:", 260, 520);

        ctx.fillStyle = "#b45309";
        ctx.font = "bold 46px monospace";
        ctx.fillText(state.roomCode, 260, 572);

        const link = document.createElement("a");
        link.download = `Barock-Quiz-QR-Raum-${state.roomCode}.png`;
        link.href = exportCanvas.toDataURL("image/png");
        link.click();
        showBanner("QR-Code als PNG gespeichert – du kannst ihn jetzt direkt auf Folie 16 einfügen!");
      };

      if (sourceCanvas) {
        ctx.drawImage(sourceCanvas, 80, 125, 360, 360);
        drawFooterAndSave();
      } else if (sourceImg) {
        const tempImg = new Image();
        tempImg.crossOrigin = "anonymous";
        tempImg.onload = () => {
          ctx.drawImage(tempImg, 80, 125, 360, 360);
          drawFooterAndSave();
        };
        tempImg.onerror = () => {
          showBanner("Bitte mache einen Rechtsklick auf den QR-Code -> 'Bild speichern unter'.");
        };
        tempImg.src = sourceImg.src;
      }
    }

    async function verifyCodeDigest(codeStr) {
      const clean = String(codeStr || "").trim();
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(clean);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        const bytes = Array.from(new Uint8Array(hashBuffer));
        return bytes.map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return null;
    }

    const EXPECTED_HOST_DIGEST = "e0e7724628ab5b1152c8719507ca4a72f56dc7ef053726c8ae82628b67fa63d8";

    async function handleHostPinUnlock(e) {
      if (e && typeof e.preventDefault === "function") e.preventDefault();
      const pinEl = document.getElementById("host-secret-pin-input");
      const entered = (pinEl?.value || "").trim();
      if (!entered) {
        showBanner("Bitte gib den Host-Code 1750 ein.");
        return;
      }

      try {
        const digest = await verifyCodeDigest(entered);
        const isValid = digest ? digest === EXPECTED_HOST_DIGEST : entered === "1750";
        if (!isValid) {
          showBanner("Falscher Host-Code! Bitte den Code 1750 verwenden.");
          return;
        }
        sessionHostCode = entered;
        await startPresentationMode();
      } catch (err) {
        console.warn("Host-Code-Prüfung Fallback aktiv:", err);
        if (entered === "1750") {
          sessionHostCode = entered;
          await startPresentationMode();
        } else {
          showBanner("Falscher Host-Code! Bitte den Code 1750 verwenden.");
        }
      }
    }

    async function startPresentationMode() {
      if (!sessionHostCode) {
        state.showHostLoginBox = true;
        showBanner("Bitte zuerst den Host-Code aus diesem Chat eingeben.");
        return;
      }
      cleanupListeners();
      state.bannerMsg = "";
      state.players = {};
      state.questionIndex = 0;
      state.roomCode = generatePin();
      state.hostToken = generateToken();
      saveHostToken(state.roomCode, state.hostToken);
      state.isVerifiedHost = true;
      state.activeQuestions = buildActiveQuestions(
        state.settings.shuffleQuestions,
        state.settings.shuffleOptions
      );
      state.view = "host_lobby";
      render();

      if (!hasLiveBackend()) {
        await initFirebase();
      }

      try {
        await writeRoomRecord(
          state.roomCode,
          {
            roomCode: state.roomCode,
            hostToken: state.hostToken,
            hostUid: activeBackendUid(),
            phase: "lobby",
            questionIndex: 0,
            questionDuration: state.settings.timePerQuestion,
            questionEndsAt: 0,
            showTextOnMobile: state.settings.showTextOnMobile,
            questionsJson: JSON.stringify(state.activeQuestions),
            updatedAt: Date.now()
          },
          false
        );

        state.unsubPlayers = subscribePlayersStream(state.roomCode, (updated) => {
          state.players = updated;
          render();
        });
      } catch (err) {
        console.error("Fehler beim Erstellen des Raums:", err);
        showBanner("Raum konnte nicht erstellt werden. Bitte erneut versuchen.");
      }
    }

    async function updateHostSetting(key, value) {
      if (!assertHostPermission()) return;
      state.settings[key] = value;

      if (key === "shuffleQuestions" || key === "shuffleOptions") {
        state.activeQuestions = buildActiveQuestions(
          state.settings.shuffleQuestions,
          state.settings.shuffleOptions
        );
      }
      render();

      try {
        await writeRoomRecord(
          state.roomCode,
          {
            questionDuration: state.settings.timePerQuestion,
            showTextOnMobile: state.settings.showTextOnMobile,
            questionsJson: JSON.stringify(state.activeQuestions),
            updatedAt: Date.now()
          },
          true
        );
      } catch (err) {
        console.error("Einstellung konnte nicht gespeichert werden:", err);
      }
    }

    async function hostStartQuestion(idx) {
      if (!assertHostPermission()) return;
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }

      state.questionIndex = idx;
      const duration = state.settings.timePerQuestion;
      state.questionDuration = duration;
      state.timeLeft = duration;
      state.questionEndsAt = Date.now() + duration * 1000;
      state.view = "host_question";
      render();

      try {
        await writeRoomRecord(
          state.roomCode,
          {
            phase: "question",
            questionIndex: idx,
            questionDuration: duration,
            questionEndsAt: state.questionEndsAt,
            showTextOnMobile: state.settings.showTextOnMobile,
            questionsJson: JSON.stringify(state.activeQuestions),
            updatedAt: Date.now()
          },
          true
        );
      } catch (err) {
        console.error("Fehler beim Starten der Frage:", err);
      }

      startHostCountdownLoop();
    }

    function startHostCountdownLoop() {
      if (state.timerId) clearInterval(state.timerId);
      const q = state.activeQuestions[state.questionIndex];

      state.timerId = setInterval(() => {
        const remainingMs = Math.max(0, state.questionEndsAt - Date.now());
        const remaining = Math.ceil(remainingMs / 1000);
        state.timeLeft = remaining;

        const timerEl = document.getElementById("host-timer-val");
        if (timerEl) timerEl.textContent = remaining + "s";

        const barEl = document.getElementById("host-timer-bar");
        if (barEl) {
          const pct = Math.max(0, Math.min(100, (remainingMs / (state.questionDuration * 1000)) * 100));
          barEl.style.width = pct + "%";
        }

        const totalPlayers = Object.keys(state.players).length;
        const answeredCount = Object.values(state.players).filter((p) => p.answeredQ === q.id).length;

        if (remaining <= 0 || (totalPlayers > 0 && answeredCount >= totalPlayers)) {
          hostRevealAnswer();
        }
      }, 250);
    }

    // Nur der Host darf während einer laufenden Frage +10 Sekunden geben!
    async function hostAddExtraTime(seconds = 10) {
      if (!assertHostPermission()) return;
      if (state.view !== "host_question") return;

      state.questionEndsAt += seconds * 1000;
      state.questionDuration += seconds;
      state.timeLeft = Math.ceil((state.questionEndsAt - Date.now()) / 1000);
      playTone("select");
      render();

      try {
        await writeRoomRecord(
          state.roomCode,
          {
            questionEndsAt: state.questionEndsAt,
            questionDuration: state.questionDuration,
            updatedAt: Date.now()
          },
          true
        );
      } catch (err) {
        console.error("Zeitverlängerung fehlgeschlagen:", err);
      }
    }

      if (!assertHostPermission()) return;
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      state.view = "host_reveal";
      render();

      try {
        await writeRoomRecord(
          state.roomCode,
          {
            phase: "reveal",
            questionIndex: state.questionIndex,
            updatedAt: Date.now()
          },
          true
        );
      } catch (err) {
        console.error("Fehler bei Auflösung:", err);
      }
    }

    async function hostShowLeaderboard() {
      if (!assertHostPermission()) return;
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      const isFinal = state.questionIndex + 1 >= state.activeQuestions.length;
      state.view = isFinal ? "host_podium" : "host_leaderboard";
      if (isFinal) {
        playTone("fanfare");
        launchConfetti();
      }
      render();

      try {
        await writeRoomRecord(
          state.roomCode,
          {
            phase: isFinal ? "podium" : "leaderboard",
            questionIndex: state.questionIndex,
            updatedAt: Date.now()
          },

        );
      } catch (err) {
        console.error("Fehler bei Rangliste:", err);
      }

    async function handlePlayerJoinSubmit(e) {
      e.preventDefault();
      const codeInput = document.getElementById("join-pin-input");
      const nameInput = document.getElementById("join-name-input");
      const code = (codeInput?.value || "").trim();
      const name = (nameInput?.value || "").trim();

      if (code.length !== 6 || !name) {
        showBanner("Bitte gib den 6-stelligen Raum-Code und deinen Namen ein.");
        return;
      }

      if (!hasLiveBackend()) {
        await initFirebase();
      }

      try {
        const initRoomData = await readRoomRecord(code);
        if (!initRoomData) {
          showBanner("Dieser Raum-Code existiert nicht. Prüfe die Zahl vorne am Beamer!");
          return;
        }

        // Sicherheit: Mitspieler erhalten niemals Host-Rechte
        state.isVerifiedHost = false;
        state.hostToken = "";
        state.roomCode = code;
        state.playerName = name;
        playTone("select");

        if (initRoomData.questionsJson) {
          try {
            state.activeQuestions = JSON.parse(initRoomData.questionsJson);
          } catch (_) {}
        }
        state.settings.showTextOnMobile = Boolean(initRoomData.showTextOnMobile);

        await writePlayerRecord(code, state.playerId, {
          id: state.playerId,
          name: state.playerName,
          score: 0,
          lastGain: 0,
          answeredQ: null,
          lastChoice: null,
          lastCorrect: false,
          joinedAt: Date.now()
        });

        state.unsubRoom = subscribeRoomStream(code, (data) => {
          if (!data) return;
          const prevIdx = state.questionIndex;
          state.questionIndex = data.questionIndex || 0;
          state.questionEndsAt = data.questionEndsAt || 0;
          state.questionDuration = data.questionDuration || 20;
          state.settings.showTextOnMobile = Boolean(data.showTextOnMobile);

          if (data.questionsJson) {
            try {
              state.activeQuestions = JSON.parse(data.questionsJson);
            } catch (_) {}
          }

          if (data.phase === "lobby") {
            state.view = "player_wait";
          } else if (data.phase === "question") {
            if (state.view !== "player_answered" || prevIdx !== state.questionIndex) {
              if (prevIdx !== state.questionIndex || state.view !== "player_question") {
                state.selectedOption = null;
                state.lastPointsEarned = 0;
              }
              state.view = "player_question";
            }
          } else if (data.phase === "reveal" || data.phase === "leaderboard") {
            state.view = "player_reveal";
          } else if (data.phase === "podium") {
            state.view = "player_podium";
          }
          render();
        });

        state.unsubPlayers = subscribePlayersStream(code, (all) => {
          state.players = all;
          if (all[state.playerId]) {
            state.lastPointsEarned = all[state.playerId].lastGain || 0;
          }
          if (state.view === "player_reveal" || state.view === "player_podium") {
            render();
          }
        });

        state.view = "player_wait";
        render();
      } catch (err) {
        console.error("Join error:", err);
        showBanner("Beitritt fehlgeschlagen. Bitte versuche es noch einmal.");
      }
    }

    async function handlePlayerAnswer(choiceIndex) {
      if (state.view !== "player_question" || state.selectedOption !== null) return;
      const q = state.activeQuestions[state.questionIndex];

      // Prüfen, ob Zeit abgelaufen ist
      const remainingSec = Math.max(0, (state.questionEndsAt - Date.now()) / 1000);
      if (remainingSec <= 0) {
        showBanner("Die Zeit für diese Frage ist leider schon abgelaufen!");
        return;
      }

      state.selectedOption = choiceIndex;
      state.view = "player_answered";

      const isCorrect = choiceIndex === q.correctIndex;
      const speedFactor = Math.max(0.4, Math.min(1, remainingSec / Math.max(1, state.questionDuration)));
      const gained = isCorrect ? Math.round(q.points * (0.5 + 0.5 * speedFactor)) : 0;

      state.lastPointsEarned = gained;
      if (isCorrect) {
        playTone("correct");
      } else {
        playTone("wrong");
      }
      render();

      try {
        const currentScore = state.players[state.playerId]?.score || 0;
        await writePlayerRecord(state.roomCode, state.playerId, {
          answeredQ: q.id,
          lastChoice: choiceIndex,
          lastCorrect: isCorrect,
          lastGain: gained,
          score: currentScore + gained
        });
      } catch (err) {
        console.error("Antwort konnte nicht gesendet werden:", err);
      }
    }

    // =========================================================================
    // 7. ALLEINE TESTEN (SOLO-MODUS OHNE RAUM-CODE)
    // =========================================================================
    function startSoloMode() {
      cleanupListeners();
      state.isVerifiedHost = false;
      state.bannerMsg = "";
      state.activeQuestions = buildActiveQuestions(false, false);
      state.view = "solo_play";
      state.questionIndex = 0;
      state.soloScore = 0;
      state.soloAnswers = [];
      state.selectedOption = null;
      state.lastPointsEarned = 0;
      startSoloTimer();
      render();
    }

    function startSoloTimer() {
      if (state.timerId) clearInterval(state.timerId);
      state.timeLeft = 20;
      state.selectedOption = null;

      state.timerId = setInterval(() => {
        state.timeLeft -= 1;
        const el = document.getElementById("solo-timer-val");
        if (el) el.textContent = state.timeLeft + "s";

        if (state.timeLeft <= 0) {
          clearInterval(state.timerId);
          state.timerId = null;
          submitSoloChoice(null);
        }
      }, 1000);
    }

    function submitSoloChoice(choiceIndex) {
      if (state.selectedOption !== null) return;
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      const q = state.activeQuestions[state.questionIndex];
      state.selectedOption = choiceIndex;
      const isCorrect = choiceIndex === q.correctIndex;
      const speedFactor = Math.max(0.4, state.timeLeft / 20);
      const gained = isCorrect ? Math.round(q.points * (0.5 + 0.5 * speedFactor)) : 0;

      state.lastPointsEarned = gained;
      state.soloScore += gained;
      if (isCorrect) playTone("correct");
      else playTone("wrong");

      state.soloAnswers.push({
        question: q,
        chosenIndex: choiceIndex,
        correctIndex: q.correctIndex,
        gained
      });
      render();
    }

    function nextSoloStep() {
      if (state.questionIndex + 1 < state.activeQuestions.length) {
        state.questionIndex += 1;
        startSoloTimer();
        render();
      } else {
        state.view = "solo_finished";
        playTone("fanfare");
        launchConfetti();
        render();
      }
    }

    function renderPlayerAnswered() {
      return `
        <main class="flex-1 max-w-md w-full mx-auto px-4 py-12 fade-in text-center flex flex-col justify-center">
          <div class="rounded-3xl bg-slate-900/95 gold-border p-8">
            <div class="text-5xl mb-3 text-amber-300">✓</div>
            <h2 class="font-barock text-2xl font-bold text-white mb-2">
              Antwort eingeloggt!
            </h2>
            <p class="text-slate-300 text-sm">
              Gleich zeigen wir vorne die Auflösung.
            </p>
          </div>
        </main>
      `;
    }

    function renderPlayerReveal() {
      const sorted = getSortedPlayers();
      const myRank = sorted.findIndex((p) => p.id === state.playerId) + 1;
      const me = state.players[state.playerId];
      const gained = me?.lastGain ?? state.lastPointsEarned;
      const total = me?.score ?? 0;
      const gotPoints = gained > 0;
      const personAhead = myRank > 1 ? sorted[myRank - 2] : null;
      const gap = personAhead ? Math.max(1, (personAhead.score || 0) - total) : 0;

      return `
        <main class="flex-1 max-w-md w-full mx-auto px-4 py-12 fade-in text-center flex flex-col justify-center">
          <div class="rounded-3xl ${
            gotPoints
              ? "bg-emerald-950/85 border-2 border-emerald-400/70"
              : "bg-slate-900/95 gold-border"
          } p-8">
            <div class="text-4xl mb-3">${gotPoints ? "🎉" : "🎵"}</div>
            <h2 class="font-barock text-2xl font-bold ${
              gotPoints ? "text-emerald-300" : "text-amber-200"
            } mb-2">
              ${gotPoints ? `Richtig! +${gained} Punkte` : "Leider keine Punkte in dieser Runde"}
            </h2>
            <p class="text-slate-200 font-mono text-base font-bold mb-1">
              Gesamt: ${total} Pkt. ${myRank > 0 ? `(Platz ${myRank} von ${sorted.length})` : ""}
            </p>
            <p class="text-xs text-slate-300 mt-2">
              ${
                myRank === 1
                  ? "👑 Du liegst aktuell auf Platz 1!"
                  : personAhead
                  ? `Nur ${gap} Punkte hinter ${escapeHtml(personAhead.name)}!`
                  : "Schau nach vorne für die Erklärung aus den Folien!"
              }
            </p>
          </div>
        </main>
      `;
    }

    function renderPlayerPodium() {
      const sorted = getSortedPlayers();
      const myRank = sorted.findIndex((p) => p.id === state.playerId) + 1;
      const me = state.players[state.playerId];

      return `
        <main class="flex-1 max-w-md w-full mx-auto px-4 py-12 fade-in text-center flex flex-col justify-center">
          <div class="rounded-3xl bg-slate-900/95 gold-border gold-glow p-8">
            <div class="text-5xl mb-3">${myRank === 1 ? "👑" : myRank <= 3 ? "🏅" : "👏"}</div>
            <h2 class="font-barock text-2xl font-extrabold text-amber-300 mb-2">
              Quiz beendet!
            </h2>
            <p class="text-white text-lg font-bold mb-1">
              ${myRank > 0 ? `Platz ${myRank} von ${sorted.length}` : escapeHtml(state.playerName)}

            <p class="font-mono text-xl font-extrabold text-amber-300 mb-4">
              ${me?.score || 0} Punkte
            </p>
            <button
              onclick="goHome()"
              class="w-full py-3 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
            >
              Zur Startseite
            </button>
          </div>
        </main>
      `;
    }

    // --- SOLO-MODUS ---
    function renderSoloPlay() {
      const q = state.activeQuestions[state.questionIndex];
      const answered = state.selectedOption !== null;
      const isCorrect = state.selectedOption === q.correctIndex;

      return `
        <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 fade-in">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <div class="flex items-center gap-2.5">
              <span class="px-3 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-bold text-xs sm:text-sm">
                Frage ${state.questionIndex + 1} / ${state.activeQuestions.length}
              </span>
              <span class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">
                ${escapeHtml(q.slideRef)}
              </span>
            </div>

            <div class="flex items-center gap-3">
              <span class="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-amber-400/40 text-amber-300 font-mono font-bold text-sm">
                ${state.soloScore} Pkt.
              </span>
              <span id="solo-timer-val" class="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 font-mono font-bold text-sm text-white">
                ${state.timeLeft}s
              </span>
            </div>
          </div>

          <div class="rounded-3xl bg-slate-900/95 gold-border p-6 mb-6">
            <h2 class="text-lg sm:text-2xl font-bold text-white leading-snug">
              ${escapeHtml(q.question)}
            </h2>
          </div>

          <div class="grid sm:grid-cols-2 gap-4 mb-6">
            ${q.options
              .map((opt, idx) => {
                const chosen = state.selectedOption === idx;
                const rightOpt = idx === q.correctIndex;
                let extraClass = "";
                if (answered) {
                  if (rightOpt) extraClass = "ring-4 ring-emerald-300";
                  else if (chosen) extraClass = "ring-4 ring-rose-300 opacity-90";
                  else extraClass = "opacity-45";
                }
                return `
                  <button
                    ${answered ? "disabled" : `onclick="submitSoloChoice(${idx})"`}
                    class="kahoot-btn-${idx} rounded-2xl p-4 sm:p-5 text-white flex items-center gap-3.5 text-left transition ${extraClass}"
                  >
                    <span class="w-10 h-10 rounded-xl bg-black/25 flex items-center justify-center text-lg font-black shrink-0">
                      ${SHAPES[idx]}
                    </span>
                    <span class="font-bold text-sm sm:text-base leading-snug">
                      ${escapeHtml(opt)}
                    </span>
                  </button>
                `;
              })
              .join("")}
          </div>

          ${
            answered
              ? `<div class="rounded-2xl bg-slate-900/95 border ${
                  isCorrect ? "border-emerald-500/50" : "border-amber-500/50"
                } p-5 fade-in">
                  <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="max-w-2xl">
                      <div class="font-bold text-base ${
                        isCorrect ? "text-emerald-300" : "text-amber-300"
                      } mb-1">
                        ${
                          isCorrect
                            ? `Richtig! +${state.lastPointsEarned} Punkte`
                            : `Richtige Antwort: ${escapeHtml(q.options[q.correctIndex])}`
                        }
                      </div>
                      <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">
                        ${escapeHtml(q.explanation)}
                      </p>
                      ${
                        q.infoCard
                          ? `<p class="text-amber-200/95 text-xs mt-2 bg-amber-950/50 border border-amber-400/30 rounded-xl p-2.5">
                              ${escapeHtml(q.infoCard)}
                             </p>`
                          : ""
                      }
                    </div>
                    <button
                      onclick="nextSoloStep()"
                      class="px-6 py-3 rounded-xl font-bold text-slate-950 bg-gradient-to-r from-amber-300 to-amber-500 hover:from-amber-200 hover:to-amber-400 transition shadow-lg shrink-0"
                    >
                      ${state.questionIndex + 1 < state.activeQuestions.length ? "Nächste Frage →" : "Auswertung →"}
                    </button>
                  </div>
                </div>`
              : ""
          }
        </main>
      `;
    }

    function renderSoloFinished() {
      const correctTotal = state.soloAnswers.filter((a) => a.chosenIndex === a.correctIndex).length;
      return `
        <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 fade-in">
          <div class="rounded-3xl bg-slate-900/95 gold-border p-7 text-center mb-8">
            <div class="text-4xl mb-2">🏆</div>
            <h2 class="font-barock text-3xl font-extrabold text-amber-300 mb-2">
              Solo-Durchgang geschafft!
            </h2>
            <p class="text-slate-300 text-base">
              Du hast <strong class="text-white">${correctTotal} von ${state.activeQuestions.length}</strong> Fragen aus den Folien richtig
              beantwortet und <strong class="text-amber-300">${state.soloScore} Punkte</strong> erreicht.
            </p>
          </div>

          <div class="space-y-3 mb-8">
            ${state.soloAnswers
              .map((item, i) => {
                const ok = item.chosenIndex === item.correctIndex;
                return `
                  <div class="rounded-2xl bg-slate-900/85 border ${
                    ok ? "border-emerald-500/35" : "border-rose-500/35"
                  } p-4">
                    <div class="flex items-start justify-between gap-3">
                      <div>
                        <span class="text-xs font-bold ${ok ? "text-emerald-300" : "text-rose-300"}">
                          ${ok ? "✓ Richtig" : "✕ Falsch"} · Frage ${i + 1} (${escapeHtml(item.question.slideRef)})
                        </span>
                        <h3 class="font-bold text-white text-sm sm:text-base mt-0.5">
                          ${escapeHtml(item.question.question)}
                        </h3>
                        <p class="text-xs text-slate-300 mt-1">
                          Lösung: <strong class="text-emerald-200">${escapeHtml(
                            item.question.options[item.correctIndex]
                          )}</strong>
                        </p>
                      </div>
                      <span class="font-mono text-sm font-bold text-amber-300 shrink-0">
                        +${item.gained}
                      </span>
                    </div>
                  </div>
                `;
              })
              .join("")}
          </div>

          <div class="flex flex-wrap justify-center gap-4">
            <button
              onclick="startSoloMode()"
              class="px-7 py-3.5 rounded-xl font-bold text-slate-950 bg-gradient-to-r from-amber-300 to-amber-500 hover:from-amber-200 hover:to-amber-400 transition shadow-lg"
            >
              Nochmal üben
            </button>
            <button
              onclick="goHome()"
              class="px-6 py-3.5 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
            >
              Zur Startseite
            </button>
          </div>
        </main>
      `;
    }

    function render() {
      let content = "";
      switch (state.view) {
        case "host_lobby":
          content = renderHostLobby();
          break;
        case "host_question":
          content = renderHostQuestion();
          break;
        case "host_reveal":
          content = renderHostReveal();
          break;
        case "host_leaderboard":
          content = renderHostLeaderboard();
          break;
        case "host_podium":
          content = renderHostPodium();
          break;
        case "player_join":
          content = renderPlayerJoin();
          break;
        case "player_wait":
          content = renderPlayerWait();
          break;
        case "player_question":
          content = renderPlayerQuestion();
          break;
        case "player_answered":
          content = renderPlayerAnswered();
          break;
        case "player_reveal":
          content = renderPlayerReveal();
          break;
        case "player_podium":
          content = renderPlayerPodium();
          break;
        case "solo_play":
          content = renderSoloPlay();
          break;
        case "solo_finished":
          content = renderSoloFinished();
          break;
        default:
          content = renderHome();
      }
      document.getElementById("app").innerHTML = renderHeader() + content;

      if (state.view === "host_lobby") {
        renderLobbyQrCode();
      }
    }

    // Globale Handler für HTML-Events
    window.goHome = () => {
      cleanupListeners();
      state.isVerifiedHost = false;
      state.view = "home";
      render();
    };
    window.toggleSound = () => {
      state.soundEnabled = !state.soundEnabled;
      render();
    };
    window.toggleHostLoginBox = toggleHostLoginBox;
    window.handleHostPinUnlock = handleHostPinUnlock;
    window.startPresentationMode = startPresentationMode;
    window.updateHostSetting = updateHostSetting;
    window.downloadQrPng = downloadQrPng;
    window.copyJoinLink = copyJoinLink;
    window.hostStartQuestion = hostStartQuestion;
    window.hostAddExtraTime = hostAddExtraTime;
    window.hostRevealAnswer = hostRevealAnswer;
    window.hostShowLeaderboard = hostShowLeaderboard;
